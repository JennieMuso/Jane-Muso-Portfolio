name: Import Existing Work to Sanity

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-sanity-work.yml

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Import projects, images, and Work page text
        run: npm run work:import
        env:
          SANITY_PROJECT_ID: lpyuxxi7
          SANITY_DATASET: production
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_ORGANIZATION_TOKEN }}
