name: Deploy Sanity Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - sanity.config.ts
      - sanity/schema/**
      - .github/workflows/deploy-sanity-studio.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Deploy Studio and schema
        run: npm exec -- sanity deploy --url muso-designs-blog --schema-required --yes
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_ORGANIZATION_TOKEN }}
          SANITY_STUDIO_PROJECT_ID: lpyuxxi7
          SANITY_STUDIO_DATASET: production
